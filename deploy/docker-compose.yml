services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deployfleet}
      POSTGRES_USER: ${POSTGRES_USER:-deployfleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev_only}
    volumes:
      - ../.local/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-deployfleet}
      PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev_only}
    ports:
      - "${ODOO_HTTP_PORT:-8169}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8172}:8072"
    volumes:
      - ../custom_addons:/mnt/extra-addons
      - ../.local/odoo:/var/lib/odoo
      - ../.local/odoo.conf:/etc/odoo/odoo.conf
    restart: unless-stopped
