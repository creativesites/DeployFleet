name: deployfleet

# Production stack for the shared demo server (199.192.23.46).
# See DEPLOYMENT.md before running this anywhere — that server already
# hosts an unrelated production Odoo instance and a staging instance
# under different compose projects. This file is deliberately isolated:
# its own named volumes, its own project name (via `name:` above, so
# `docker compose -p` collision with the existing stacks isn't possible),
# and host ports taken from .env.production, never hardcoded to a
# default that might already be in use — confirm free ports during the
# pre-flight inventory (scripts/preflight-inventory.sh) before first run.

services:
  db:
    image: postgres:16
    container_name: deployfleet_prod_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
    volumes:
      - deployfleet_prod_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    # Deliberately no host port mapping — Postgres is reachable only from
    # the odoo service on the internal compose network, not exposed on
    # the host at all, let alone a port that might collide with the
    # existing instances' own Postgres.

  odoo:
    image: odoo:19.0
    container_name: deployfleet_prod_odoo
    depends_on:
      - db
    environment:
      HOST: db
      USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.production}
      PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
    ports:
      - "${DEPLOYFLEET_HTTP_PORT:?DEPLOYFLEET_HTTP_PORT must be set in .env.production — confirm it is free via the pre-flight inventory first}:8069"
      - "${DEPLOYFLEET_LONGPOLLING_PORT:?DEPLOYFLEET_LONGPOLLING_PORT must be set in .env.production — confirm it is free via the pre-flight inventory first}:8072"
    volumes:
      - ../custom_addons:/mnt/extra-addons:ro
      - deployfleet_prod_filestore:/var/lib/odoo
      # Generated by scripts/deploy-demo.sh from deploy/odoo.prod.conf.template —
      # never commit the rendered file, it contains the admin_passwd value.
      - ./.generated/odoo.prod.conf:/etc/odoo/odoo.conf:ro
    restart: unless-stopped

volumes:
  deployfleet_prod_postgres:
    name: deployfleet_prod_postgres
  deployfleet_prod_filestore:
    name: deployfleet_prod_filestore
